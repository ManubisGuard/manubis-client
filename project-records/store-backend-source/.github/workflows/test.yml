name: Store backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: manubis_store_test
          POSTGRES_USER: store_test
          POSTGRES_PASSWORD: store_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_test -d manubis_store_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://store_test:store_test_password@127.0.0.1:5432/manubis_store_test
      ADMIN_API_TOKEN: ci-only-not-a-production-secret
      PANEL_BASE_URL: https://vip.qoqnusradio.top
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Apply migrations and check schema
        run: alembic upgrade head && alembic check
      - name: Run test suite
        run: pytest -q
      - name: Check Python syntax
        run: python -m compileall -q app migrations tests
      - name: Check admin dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/static/admin.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Inline admin script not found')
          Path('/tmp/admin-inline.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/admin-inline.js
      - name: Validate test Compose configuration
        run: docker compose --env-file .env.compose.example -f compose.yaml config --quiet
      - name: Build production-style container image
        run: docker build --tag manubisguard-store-backend:ci .
